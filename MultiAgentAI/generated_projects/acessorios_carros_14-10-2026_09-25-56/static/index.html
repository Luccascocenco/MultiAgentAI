<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja TURBO GARAGE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="img/logo-turbo-garage.png" alt="Logotipo TURBO GARAGE">
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Iluminação</a></li>
                <li><a href="#">Performance</a></li>
                <li><a href="#">Ofertas</a></li>
            </ul>
        </nav>
        <form>
            <input type="search" placeholder="Pesquisar produtos">
        </form>
        <button><i class="fas fa-search"></i></button>
        <button><i class="fas fa-cart-arrow-down"></i></button>
    </header>
    <main>
        <section id="hero">
            <h1>EQUIPE SEU CARRO. SUPERE LIMITES.</h1>
            <p>Acessórios automotivos para quem busca estilo, tecnologia e personalidade em cada detalhe.</p>
            <button>Explorar produtos</button>
            <button>Ver ofertas</button>
            <img src="img/hero-image.jpg" alt="Imagem de destaque">
        </section>
        <section id="produtos-grid">
            <!-- Grid de produtos -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
